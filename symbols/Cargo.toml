[package]
name = "keyframer-vitals-symbols"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Motion Vitals symbol extraction: Mach-O dSYMs, ELF DWARF, R8 mappings and React Native sites files into the chunked format of protocol/vitals.ts."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
object = { version = "0.36", default-features = false, features = ["std", "read_core", "elf", "macho", "compression"] }
gimli = { version = "0.31", default-features = false, features = ["std", "read"] }
cpp_demangle = "0.4"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = [".", "wasm"]
default-members = ["."]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1
