org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The relay the example app connects to. Emulator: 10.0.2.2. Device: your LAN IP, or 127.0.0.1 with
# `adb reverse tcp:8790 tcp:8790`. Override with -Pkeyframer.host=... -Pkeyframer.port=...
keyframer.host=
keyframer.port=8790

# Maven Central: dev.keyframer:keyframer-inspector, -core and -noop (each module's gradle.properties
# names its artifact). Publish: ./gradlew publishToMavenCentral, with ORG_GRADLE_PROJECT_mavenCentralUsername,
# ORG_GRADLE_PROJECT_mavenCentralPassword, ORG_GRADLE_PROJECT_signingInMemoryKey and
# ORG_GRADLE_PROJECT_signingInMemoryKeyPassword in the environment. Never commit those.
GROUP=dev.keyframer
VERSION_NAME=0.1.0
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/keyframer-dev/inspector
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/keyframer-dev/inspector
POM_SCM_CONNECTION=scm:git:git://github.com/keyframer-dev/inspector.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/keyframer-dev/inspector.git
POM_DEVELOPER_ID=keyframer
POM_DEVELOPER_NAME=Catalin Miron
POM_DEVELOPER_URL=https://keyframer.dev
